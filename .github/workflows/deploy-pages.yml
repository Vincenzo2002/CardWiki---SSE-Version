name: Deploy CardWiki Frontend

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "14"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: |
          npm run build:prod -- \
            --base-href=/CardWiki---SSE-Version/

          # Serve known Angular routes with HTTP 200 for direct URL analysis.
          # Add concrete paths here when testing dynamic routes (e.g. decks/123).
          routes=(
            about
            search
            categories
            users
            login
            settings
            clipboard
            help/markdown-syntax
          )

          for route in "${routes[@]}"; do
            mkdir -p "dist/cardwiki/$route"
            cp dist/cardwiki/index.html "dist/cardwiki/$route/index.html"
          done

          cp dist/cardwiki/index.html \
             dist/cardwiki/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/cardwiki

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
